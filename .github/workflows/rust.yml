name: Rust

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build python3-dev python3-venv python3-pip

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Python package (provides static lib for local build)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install ".[test]"

      - name: Set MOMENTUMX_BUILD_DIR
        run: |
          MX_LIB=$(.venv/bin/python3 -c \
            "import pathlib, momentumx; \
             print(pathlib.Path(momentumx.__file__).parent / 'lib')")
          echo "MOMENTUMX_BUILD_DIR=$MX_LIB" >> $GITHUB_ENV

      - name: Build
        run: cargo build --manifest-path rust/Cargo.toml

      - name: Build examples
        run: cargo build --manifest-path rust/Cargo.toml --examples

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml

  publish:
    name: Publish to crates.io
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Stage C++ source into crate
        run: |
          cp ext/buffer.cpp  ext/buffer.h  \
             ext/context.cpp ext/context.h \
             ext/control.cpp ext/control.h \
             ext/stream.cpp  ext/stream.h  \
             ext/inspector.h ext/utils.h   \
             ext/mx_c_api.cpp ext/mx_c_api.h \
             rust/cpp/

      - name: Publish to crates.io
        run: cargo publish --manifest-path rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
